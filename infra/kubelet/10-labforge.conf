# Kubelet settings LabForge depends on, as a k3s drop-in file. Installed into
# /var/lib/rancher/k3s/agent/etc/kubelet.conf.d/ on every node: bind-mounted by
# `make dev-up` (k3d) and copied by the Ansible k3s roles (prod).
apiVersion: kubelet.config.k8s.io/v1beta1
kind: KubeletConfiguration

# Max processes per pod. Without it a fork bomb in one lab exhausts the node's
# PIDs and breaks every other lab on it. Measured by `make test-security`.
podPidsLimit: 1024

# When a lab overruns its memory limit, kill only the offending process. The
# cgroup v2 default since Kubernetes 1.28 kills every process in the container,
# including ttyd, which would end the user's whole lab for one runaway program.
singleProcessOOMKill: true
