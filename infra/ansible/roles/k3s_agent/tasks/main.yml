---
- name: Create the k3s config directory
  ansible.builtin.file:
    path: /etc/rancher/k3s
    state: directory
    mode: "0755"

- name: Write the k3s agent config
  ansible.builtin.copy:
    dest: /etc/rancher/k3s/config.yaml
    mode: "0600"
    content: |
      # Managed by Ansible (infra/ansible/roles/k3s_agent)
      node-ip: {{ private_ip }}
      node-external-ip: {{ ansible_host }}

- name: Check installed k3s version
  ansible.builtin.command:
    cmd: k3s --version
  register: k3s_agent_installed
  changed_when: false
  failed_when: false

- name: Download the k3s installer
  ansible.builtin.get_url:
    url: https://get.k3s.io
    dest: /usr/local/bin/k3s-install.sh
    mode: "0755"

- name: Install the k3s agent and join the server, version {{ k3s_version }}
  ansible.builtin.command:
    cmd: /usr/local/bin/k3s-install.sh
  environment:
    INSTALL_K3S_VERSION: "{{ k3s_version }}"
    INSTALL_K3S_EXEC: agent
    K3S_URL: "https://{{ hostvars[groups['k3s_servers'][0]].private_ip }}:6443"
    K3S_TOKEN: "{{ hostvars[groups['k3s_servers'][0]].k3s_server_node_token.content | b64decode | trim }}"
  when: k3s_version not in (k3s_agent_installed.stdout | default(''))
  changed_when: true
  no_log: true
