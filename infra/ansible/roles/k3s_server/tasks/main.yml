---
- name: Create the k3s config directory
  ansible.builtin.file:
    path: /etc/rancher/k3s
    state: directory
    mode: "0755"

- name: Write the k3s server config
  ansible.builtin.copy:
    dest: /etc/rancher/k3s/config.yaml
    mode: "0600"
    content: |
      # Managed by Ansible (infra/ansible/roles/k3s_server)
      node-ip: {{ private_ip }}
      node-external-ip: {{ ansible_host }}
      tls-san:
        - {{ ansible_host }}
      write-kubeconfig-mode: "0600"

- name: Check installed k3s version
  ansible.builtin.command:
    cmd: k3s --version
  register: k3s_server_installed
  changed_when: false
  failed_when: false

- name: Download the k3s installer
  ansible.builtin.get_url:
    url: https://get.k3s.io
    dest: /usr/local/bin/k3s-install.sh
    mode: "0755"

- name: Install k3s server {{ k3s_version }}
  ansible.builtin.command:
    cmd: /usr/local/bin/k3s-install.sh
  environment:
    INSTALL_K3S_VERSION: "{{ k3s_version }}"
    INSTALL_K3S_EXEC: server
  when: k3s_version not in (k3s_server_installed.stdout | default(''))
  changed_when: true

- name: Wait for the node token
  ansible.builtin.wait_for:
    path: /var/lib/rancher/k3s/server/node-token
    timeout: 120

- name: Read the join token for agents
  ansible.builtin.slurp:
    src: /var/lib/rancher/k3s/server/node-token
  register: k3s_server_node_token
  no_log: true

- name: Read the admin kubeconfig
  ansible.builtin.slurp:
    src: /etc/rancher/k3s/k3s.yaml
  register: k3s_server_kubeconfig
  no_log: true

- name: Save kubeconfig on this machine (git-ignored), pointed at the public IP
  ansible.builtin.copy:
    dest: "{{ playbook_dir }}/kubeconfig"
    mode: "0600"
    content: "{{ k3s_server_kubeconfig.content | b64decode | replace('https://127.0.0.1:6443', 'https://' + ansible_host + ':6443') }}"
  delegate_to: localhost
  become: false
  no_log: true
