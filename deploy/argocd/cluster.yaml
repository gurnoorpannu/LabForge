# Cluster add-ons: cert-manager, then the issuers/certificate/Traefik config.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: cert-manager
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://charts.jetstack.io
    chart: cert-manager
    targetRevision: v1.21.3
    helm:
      valuesObject:
        crds: { enabled: true }
  destination:
    server: https://kubernetes.default.svc
    namespace: cert-manager
  syncPolicy:
    automated: { prune: true, selfHeal: true }
    syncOptions: [CreateNamespace=true]
---
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: cluster-config
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/gurnoorpannu/LabForge.git
    targetRevision: main
    path: deploy/cluster
  destination:
    server: https://kubernetes.default.svc
  syncPolicy:
    automated: { prune: true, selfHeal: true }
    # ClusterIssuer/Certificate CRDs arrive with cert-manager; retry until then.
    retry:
      limit: 10
      backoff: { duration: 30s, factor: 2, maxDuration: 5m }
