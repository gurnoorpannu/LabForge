# The one certificate for the one host. Lives in kube-system because Traefik's
# default TLS store (traefik-config.yaml) reads it from there.
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: labforge-tls
  namespace: kube-system
spec:
  secretName: labforge-tls
  dnsNames:
    - labs.gurnoor.online
  issuerRef:
    kind: ClusterIssuer
    name: letsencrypt-prod
