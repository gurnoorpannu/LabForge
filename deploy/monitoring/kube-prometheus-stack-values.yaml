# kube-prometheus-stack 92.20.0 (Prometheus Operator v0.94.2, Alertmanager v0.34.2).
# Installed by deploy/argocd/monitoring.yaml, or by hand:
#   helm upgrade --install kps prometheus-community/kube-prometheus-stack --version 92.20.0 \
#     -n monitoring --create-namespace -f deploy/monitoring/kube-prometheus-stack-values.yaml
#
# Needs one Secret you create by hand (never committed):
#   kubectl -n monitoring create secret generic alertmanager-discord \
#     --from-literal=webhook-url='https://discord.com/api/webhooks/...'

# k3s runs the control plane inside one process, so these targets aren't
# scrapeable the usual way and would only produce false TargetDown alerts.
kubeControllerManager: { enabled: false }
kubeScheduler: { enabled: false }
kubeProxy: { enabled: false }
kubeEtcd: { enabled: false }

prometheus:
  prometheusSpec:
    # Pick up ServiceMonitors / PrometheusRules from any namespace, not only
    # ones labelled for this Helm release (LabForge's live in labforge/monitoring).
    serviceMonitorSelectorNilUsesHelmValues: false
    podMonitorSelectorNilUsesHelmValues: false
    ruleSelectorNilUsesHelmValues: false
    retention: 7d
    resources:
      requests: { cpu: 100m, memory: 400Mi }
      limits: { memory: 1Gi }

alertmanager:
  alertmanagerSpec:
    # Mounted at /etc/alertmanager/secrets/alertmanager-discord/
    secrets: [alertmanager-discord]
    resources:
      requests: { cpu: 10m, memory: 32Mi }
      limits: { memory: 128Mi }
  config:
    global:
      resolve_timeout: 5m
    route:
      receiver: discord
      group_by: [alertname, namespace]
      group_wait: 30s
      group_interval: 5m
      repeat_interval: 4h
      routes:
        # The operator's always-firing heartbeat alert: silence it.
        - receiver: "null"
          matchers: [alertname = "Watchdog"]
        - receiver: "null"
          matchers: [alertname = "InfoInhibitor"]
    receivers:
      - name: "null"
      - name: discord
        discord_configs:
          - webhook_url_file: /etc/alertmanager/secrets/alertmanager-discord/webhook-url
            send_resolved: true

grafana:
  # Dashboards from ConfigMaps labelled grafana_dashboard=1 (LabForge's is in
  # deploy/monitoring/manifests). Reach Grafana with:
  #   kubectl -n monitoring port-forward svc/kps-grafana 3001:80
  sidecar:
    dashboards:
      enabled: true
      label: grafana_dashboard
      searchNamespace: ALL
  # Prod: create Secret grafana-admin (keys admin-user, admin-password) first.
  admin:
    existingSecret: grafana-admin
    userKey: admin-user
    passwordKey: admin-password
  # Grafana 13 needs headroom at startup: at a 256Mi limit it sat at ~230Mi
  # burning ~6 cores in GC and never came up before its liveness probe fired.
  resources:
    requests: { cpu: 50m, memory: 256Mi }
    limits: { memory: 768Mi }

kube-state-metrics:
  resources:
    requests: { cpu: 10m, memory: 32Mi }
    limits: { memory: 128Mi }

prometheus-node-exporter:
  resources:
    requests: { cpu: 10m, memory: 24Mi }
    limits: { memory: 64Mi }
