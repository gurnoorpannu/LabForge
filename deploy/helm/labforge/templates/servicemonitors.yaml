{{- if .Values.monitoring.serviceMonitors }}
{{- range $c := list (dict "name" "api" "port" "metrics") (dict "name" "pool-controller" "port" "metrics") }}
---
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: labforge-{{ $c.name }}
  labels: {{- include "labforge.labels" $ | nindent 4 }}
spec:
  selector:
    matchLabels:
      app.kubernetes.io/name: labforge
      app.kubernetes.io/component: {{ $c.name }}
  endpoints:
    - port: {{ $c.port }}
      path: /metrics
      interval: 15s
{{- end }}
{{- end }}
