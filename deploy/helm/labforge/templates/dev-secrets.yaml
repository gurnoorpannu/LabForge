{{- if .Values.devSecrets.create }}
# LOCAL/TEST ONLY (devSecrets.create=true). Fixed, public throwaway values.
# Production uses Secrets created by hand; see docs/operations.md.
apiVersion: v1
kind: Secret
metadata:
  name: {{ .Values.postgres.existingSecret }}
  labels: {{- include "labforge.labels" . | nindent 4 }}
stringData:
  POSTGRES_PASSWORD: labforge-dev-only
---
apiVersion: v1
kind: Secret
metadata:
  name: {{ .Values.api.existingSecret }}
  labels: {{- include "labforge.labels" . | nindent 4 }}
stringData:
  SESSION_SECRET: dev-only-session-secret-not-for-production-0123456789
{{- end }}
