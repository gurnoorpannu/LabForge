# Postgres: source of truth for lab assignment, sessions, audit log.
# Single instance with a local-path PVC (see docs/failure-modes.md for what
# losing it means). Runs under the `restricted` Pod Security profile.
apiVersion: v1
kind: Service
metadata:
  name: labforge-postgres
  labels: {{- include "labforge.labels" . | nindent 4 }}
spec:
  selector: {{- include "labforge.selector" (dict "component" "postgres") | nindent 4 }}
  ports:
    - name: postgres
      port: 5432
      targetPort: postgres
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: labforge-postgres
  labels: {{- include "labforge.labels" . | nindent 4 }}
    app.kubernetes.io/component: postgres
spec:
  serviceName: labforge-postgres
  replicas: 1
  selector:
    matchLabels: {{- include "labforge.selector" (dict "component" "postgres") | nindent 6 }}
  template:
    metadata:
      labels: {{- include "labforge.selector" (dict "component" "postgres") | nindent 8 }}
    spec:
      automountServiceAccountToken: false
      enableServiceLinks: false
      # uid 70 = the postgres user in the Alpine image
      securityContext: {{- include "labforge.podSecurity" (dict "uid" 70) | nindent 8 }}
      containers:
        - name: postgres
          image: {{ .Values.postgres.image }}
          ports:
            - name: postgres
              containerPort: 5432
          env:
            - name: POSTGRES_USER
              value: labforge
            - name: POSTGRES_DB
              value: labforge
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.postgres.existingSecret }}
                  key: POSTGRES_PASSWORD
            # Subdirectory: the volume root holds lost+found on some filesystems.
            - name: PGDATA
              value: /var/lib/postgresql/data/pgdata
          readinessProbe:
            exec:
              command: ["pg_isready", "-U", "labforge", "-d", "labforge"]
            periodSeconds: 5
          livenessProbe:
            exec:
              command: ["pg_isready", "-U", "labforge", "-d", "labforge"]
            initialDelaySeconds: 30
            periodSeconds: 10
          resources: {{- toYaml .Values.postgres.resources | nindent 12 }}
          securityContext: {{- include "labforge.containerSecurity" . | nindent 12 }}
          volumeMounts:
            - name: data
              mountPath: /var/lib/postgresql/data
            - name: run   # unix socket dir; root FS is read-only
              mountPath: /var/run/postgresql
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: run
          emptyDir: {}
        - name: tmp
          emptyDir: {}
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: ["ReadWriteOnce"]
        storageClassName: {{ .Values.postgres.storageClass }}
        resources:
          requests:
            storage: {{ .Values.postgres.storage }}
