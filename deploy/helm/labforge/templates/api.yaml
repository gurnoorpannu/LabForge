apiVersion: v1
kind: Service
metadata:
  name: labforge-api
  labels: {{- include "labforge.labels" . | nindent 4 }}
    app.kubernetes.io/component: api
spec:
  selector: {{- include "labforge.selector" (dict "component" "api") | nindent 4 }}
  ports:
    - name: http
      port: 3000
      targetPort: http
    # Private: not referenced by the Ingress; Prometheus only.
    - name: metrics
      port: 9090
      targetPort: metrics
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: labforge-api
  labels: {{- include "labforge.labels" . | nindent 4 }}
    app.kubernetes.io/component: api
spec:
  replicas: {{ .Values.api.replicas }}
  strategy:
    rollingUpdate: { maxUnavailable: 0, maxSurge: 1 }
  selector:
    matchLabels: {{- include "labforge.selector" (dict "component" "api") | nindent 6 }}
  template:
    metadata:
      labels: {{- include "labforge.selector" (dict "component" "api") | nindent 8 }}
        labforge.io/db-client: "true"
      annotations:
        checksum/config: {{ include (print $.Template.BasePath "/configmap.yaml") . | sha256sum }}
    spec:
      serviceAccountName: labforge-api
      enableServiceLinks: false
      securityContext: {{- include "labforge.podSecurity" dict | nindent 8 }}
      affinity:
        podAntiAffinity:   # spread replicas over nodes when there are several
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              podAffinityTerm:
                topologyKey: kubernetes.io/hostname
                labelSelector:
                  matchLabels: {{- include "labforge.selector" (dict "component" "api") | nindent 20 }}
      containers:
        - name: api
          image: {{ include "labforge.image" (dict "root" . "name" .Values.images.api) }}
          imagePullPolicy: {{ .Values.images.pullPolicy }}
          ports:
            - name: http
              containerPort: 3000
            - name: metrics
              containerPort: 9090
          envFrom:
            - configMapRef:
                name: labforge-config
          env:
            {{- include "labforge.dbEnv" . | nindent 12 }}
            - name: SESSION_SECRET
              valueFrom:
                secretKeyRef: { name: {{ .Values.api.existingSecret }}, key: SESSION_SECRET }
            - name: OIDC_CLIENT_ID
              valueFrom:
                secretKeyRef: { name: {{ .Values.api.existingSecret }}, key: OIDC_CLIENT_ID, optional: true }
            - name: OIDC_CLIENT_SECRET
              valueFrom:
                secretKeyRef: { name: {{ .Values.api.existingSecret }}, key: OIDC_CLIENT_SECRET, optional: true }
          readinessProbe:
            httpGet: { path: /readyz, port: http }
            periodSeconds: 5
          livenessProbe:
            httpGet: { path: /healthz, port: http }
            periodSeconds: 10
          resources: {{- toYaml .Values.api.resources | nindent 12 }}
          securityContext: {{- include "labforge.containerSecurity" . | nindent 12 }}
---
# Everything on the host that isn't /lab/<id>/... goes to the API (UI, /auth,
# /api). Lab Ingresses use longer paths, so Traefik routes those to the labs.
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: labforge-api
  labels: {{- include "labforge.labels" . | nindent 4 }}
spec:
  ingressClassName: {{ .Values.ingress.className }}
  rules:
    - {{- with .Values.host }}
      host: {{ . }}
      {{- end }}
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: labforge-api
                port: { name: http }
{{- if gt (int .Values.api.replicas) 1 }}
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: labforge-api
  labels: {{- include "labforge.labels" . | nindent 4 }}
spec:
  minAvailable: 1
  selector:
    matchLabels: {{- include "labforge.selector" (dict "component" "api") | nindent 6 }}
{{- end }}
