# k3d on a laptop: `make chart-up`. Images are imported into the cluster.
images:
  registry: ""
  tag: dev
  pullPolicy: IfNotPresent
publicBaseUrl: http://localhost:8080
host: ""
network:
  nodeCidr: 172.28.0.0/16   # pinned by `make dev-up`
lab:
  poolSize: 2
  maxConcurrent: 6
api:
  replicas: 1
poolController:
  replicas: 2
postgres:
  storage: 1Gi
devSecrets:
  create: true
